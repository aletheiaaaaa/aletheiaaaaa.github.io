  <text class="mvp" x="248" y="104" text-anchor="end"   dominant-baseline="central">Bb5</text>
  <text class="mv"  x="432" y="104" text-anchor="start" dominant-baseline="central">Bc4</text>
  <text class="mvp" x="128" y="208" text-anchor="end"   dominant-baseline="central">a6</text>
  <text class="mv"  x="224" y="208" text-anchor="start" dominant-baseline="central">Nf6</text>
  <text class="mv"  x="455" y="208" text-anchor="end"   dominant-baseline="central">Bc5</text>
  <text class="mv"  x="72"  y="306" text-anchor="end"   dominant-baseline="central">Ba4</text>
  <text class="mvp" x="128" y="306" text-anchor="start" dominant-baseline="central">Bxc6</text>
  <text class="mv"  x="232" y="306" text-anchor="end"   dominant-baseline="central">O-O</text>
  <text class="mv"  x="392" y="306" text-anchor="end"   dominant-baseline="central">c3</text>
  <text class="mv"  x="448" y="306" text-anchor="start" dominant-baseline="central">O-O</text>
  <text class="tag" x="112" y="402" text-anchor="end"   dominant-baseline="central">dxc6</text>
  <text class="tag" x="166" y="402" text-anchor="start" dominant-baseline="central">bxc6</text>

  <rect class="net" x="216" y="400" width="110" height="58" rx="8"/>
  <text x="271" y="416" text-anchor="middle" fill="#c7d2fe" font-size="12" font-style="italic">f&#952;</text>
  <line class="netl" x1="236" y1="432" x2="261" y2="439"/>
  <line class="netl" x1="236" y1="446" x2="261" y2="439"/>
  <line class="netl" x1="261" y1="439" x2="291" y2="439"/>
  <circle class="netd" cx="236" cy="432" r="2.5"/>
  <circle class="netd" cx="236" cy="446" r="2.5"/>
  <circle class="netd" cx="261" cy="439" r="2.5"/>
  <circle class="netd" cx="291" cy="439" r="2.5"/>
  <line stroke="#818cf8" stroke-width="1.5" x1="216" y1="420" x2="149.4" y2="367.4" marker-end="url(#ev)"/>
  <rect class="meter"  x="158" y="336" width="34" height="7" rx="2"/>
  <rect class="meterf" x="158" y="336" width="20" height="7" rx="2"/>
  <text class="tag" x="196" y="339" text-anchor="start" dominant-baseline="central">v</text>

  <rect class="net" x="28" y="471" width="18" height="14" rx="3"/>
  <text class="lgd" x="54" y="480" dominant-baseline="central" fill="#c7d2fe">value net f&#952;</text>
  <rect class="meter"  x="210" y="476" width="30" height="7"/>
  <rect class="meterf" x="210" y="476" width="18" height="7"/>
  <text class="lgd" x="248" y="480" dominant-baseline="central">leaf value v (no simulation)</text>
</svg>
