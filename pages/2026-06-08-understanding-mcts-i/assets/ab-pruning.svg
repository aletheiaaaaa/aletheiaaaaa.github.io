  <circle class="node" cx="380" cy="360" r="12"></circle>
  <circle class="node" cx="460" cy="360" r="12"></circle>
  <circle class="nodex" cx="540" cy="360" r="12"></circle>
  <circle class="nodex" cx="620" cy="360" r="12"></circle>

  <line class="cut" x1="536" y1="206" x2="546" y2="216" stroke-linecap="round"></line>
  <line class="cut" x1="546" y1="206" x2="536" y2="216" stroke-linecap="round"></line>
  <line class="cut" x1="276" y1="307" x2="286" y2="317" stroke-linecap="round"></line>
