<svg width="680" height="412" viewBox="0 0 680 412" xmlns="http://www.w3.org/2000/svg" role="img" data-themed="true">
  <title>Alpha-beta pruning chess search tree</title>
  <desc>An abstract four-level minimax tree of circular nodes representing a chess search from the position after 1.e4 e5 2.Nf3 Nc6. Each edge is annotated with a plausible move. A purple principal variation runs from root to a leaf, several branches are pruned (shown as faded purple dashed edges with cut marks and pruned labels), and a legend at the bottom keys the line styles.</desc>
  

  <line class="edgep" x1="321.3" y1="71.7" x2="195.3" y2="150.5"></line>
  <line class="edge" x1="358.7" y1="71.7" x2="484.7" y2="150.5"></line>

  <line class="edgep" x1="168.8" y1="174.1" x2="110.0" y2="247.5"></line>
  <line class="edge" x1="191.2" y1="174.1" x2="250.0" y2="247.5"></line>
  <line class="edge" x1="488.8" y1="174.1" x2="430.0" y2="247.5"></line>
  <line class="edgex" x1="511.2" y1="174.1" x2="570.0" y2="247.5"></line>

  <line class="edge" x1="94.1" y1="274.9" x2="64.5" y2="348.9"></line>
  <line class="edgep" x1="105.9" y1="274.9" x2="135.5" y2="348.9"></line>
  <line class="edge" x1="254.1" y1="274.9" x2="224.5" y2="348.9"></line>
  <line class="edgex" x1="265.9" y1="274.9" x2="295.5" y2="348.9"></line>
  <line class="edge" x1="414.1" y1="274.9" x2="384.5" y2="348.9"></line>
  <line class="edge" x1="425.9" y1="274.9" x2="455.5" y2="348.9"></line>
  <line class="edgex" x1="574.1" y1="274.9" x2="544.5" y2="348.9"></line>
  <line class="edgex" x1="585.9" y1="274.9" x2="615.5" y2="348.9"></line>

  <circle class="nodep" cx="340" cy="60" r="22"></circle>
  <circle class="nodep" cx="180" cy="160" r="18"></circle>
  <circle class="node" cx="500" cy="160" r="18"></circle>
  <circle class="nodep" cx="100" cy="260" r="16"></circle>
  <circle class="node" cx="260" cy="260" r="16"></circle>
  <circle class="node" cx="420" cy="260" r="16"></circle>
  <circle class="nodex" cx="580" cy="260" r="16"></circle>
  <circle class="node" cx="60" cy="360" r="12"></circle>
