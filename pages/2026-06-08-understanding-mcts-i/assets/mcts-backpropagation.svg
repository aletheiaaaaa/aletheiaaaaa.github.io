<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" data-themed="true">
  <title>MCTS stage 4 — Backup</title>
  <desc>The leaf value v is propagated up the selection path. Upward arrows run from Bxc6 through a6 and Bb5 to the root, and each visited node carries a pulse ring indicating its visit count N and mean value Q have been updated.</desc>
  <defs>
    <marker id="bak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"></path></marker>
  </defs>
  

  <line class="edge" x1="358.7" y1="71.7" x2="484.7" y2="150.5"></line>
  <line class="edge" x1="191.2" y1="174.1" x2="250.0" y2="247.5"></line>
  <line class="edge" x1="488.8" y1="174.1" x2="430.0" y2="247.5"></line>
  <line class="edge" x1="94.1" y1="274.9" x2="64.5" y2="348.9"></line>
  <line class="edge" x1="254.1" y1="274.9" x2="224.5" y2="348.9"></line>
  <line class="edge" x1="414.1" y1="274.9" x2="384.5" y2="348.9"></line>
  <line class="edge" x1="425.9" y1="274.9" x2="455.5" y2="348.9"></line>
  <line class="edgenew" x1="135.9" y1="371.3" x2="111.4" y2="438.6"></line>
  <line class="edgenew" x1="144.1" y1="371.3" x2="168.6" y2="438.6"></line>

  <line class="edgeback" x1="135.5" y1="348.9" x2="105.9" y2="274.9" marker-end="url(#bak)"></line>
  <line class="edgeback" x1="110.0" y1="247.5" x2="168.8" y2="174.1" marker-end="url(#bak)"></line>
  <line class="edgeback" x1="195.3" y1="150.5" x2="321.3" y2="71.7" marker-end="url(#bak)"></line>

  <circle class="ring" cx="340" cy="60" r="26"></circle>
  <circle class="ring" cx="180" cy="160" r="22"></circle>
  <circle class="ring" cx="100" cy="260" r="20"></circle>
  <circle class="ring" cx="140" cy="360" r="16"></circle>

  <circle class="nodep" cx="340" cy="60" r="22"></circle>
  <circle class="nodep" cx="180" cy="160" r="18"></circle>
  <circle class="node" cx="500" cy="160" r="18"></circle>
  <circle class="nodep" cx="100" cy="260" r="16"></circle>
  <circle class="node" cx="260" cy="260" r="16"></circle>
  <circle class="node" cx="420" cy="260" r="16"></circle>
  <circle class="node" cx="60" cy="360" r="12"></circle>
  <circle class="leaf" cx="140" cy="360" r="12"></circle>
  <circle class="node" cx="220" cy="360" r="12"></circle>
  <circle class="node" cx="380" cy="360" r="12"></circle>
  <circle class="node" cx="460" cy="360" r="12"></circle>
  <circle class="nodenew" cx="108" cy="448" r="10"></circle>
  <circle class="nodenew" cx="172" cy="448" r="10"></circle>

  <text class="mvp" x="248" y="104" text-anchor="end" dominant-baseline="central">Bb5</text>
  <text class="mv" x="432" y="104" text-anchor="start" dominant-baseline="central">Bc4</text>
  <text class="mvp" x="128" y="208" text-anchor="end" dominant-baseline="central">a6</text>
  <text class="mv" x="224" y="208" text-anchor="start" dominant-baseline="central">Nf6</text>
  <text class="mv" x="455" y="208" text-anchor="end" dominant-baseline="central">Bc5</text>
  <text class="mv" x="72" y="306" text-anchor="end" dominant-baseline="central">Ba4</text>
  <text class="mvp" x="128" y="306" text-anchor="start" dominant-baseline="central">Bxc6</text>
  <text class="mv" x="232" y="306" text-anchor="end" dominant-baseline="central">O-O</text>
  <text class="mv" x="392" y="306" text-anchor="end" dominant-baseline="central">c3</text>
  <text class="mv" x="448" y="306" text-anchor="start" dominant-baseline="central">O-O</text>
  <text class="tag" x="112" y="402" text-anchor="end" dominant-baseline="central">dxc6</text>
  <text class="tag" x="166" y="402" text-anchor="start" dominant-baseline="central">bxc6</text>
  <text class="tag" x="160" y="344" text-anchor="start" dominant-baseline="central">v</text>

  <line class="edgeback" x1="30" y1="480" x2="58" y2="480" marker-end="url(#bak)"></line>
  <text class="lgd" x="66" y="480" dominant-baseline="central">value backed up</text>
  <circle class="ring" cx="216" cy="480" r="8"></circle>
  <text class="lgd" x="230" y="480" dominant-baseline="central">N, Q updated</text>
</svg>