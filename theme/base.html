<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%%TITLE%%</title>
  <link rel="stylesheet" href="%%ROOT_REL%%style.css">
  %%MATH%%
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script>window.__ROOT_REL__ = "%%ROOT_REL%%";</script>
</head>
<body data-page="%%PAGE_ID%%">
  <canvas id="dotfield" class="dot-bg" aria-hidden="true"></canvas>
  <div id="reading-progress" class="reading-progress"></div>
  <header class="site-header">
    <nav class="site-nav">
      <div class="nav-brand"><a href="%%ROOT_REL%%index.html">%%NAV_BRAND%%</a></div>
      <ul class="nav-links">%%NAV_ITEMS%%</ul>
      <div class="nav-end">
        <button class="search-btn" id="search-btn" aria-label="Search">search <kbd>&#8984;K</kbd></button>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">◑</button>
        <button class="nav-menu-btn" id="nav-menu-btn" aria-label="Open menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>
  <main>
    %%BODY%%
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>%%FOOTER_LEFT%%</span>
      <nav class="footer-links">%%FOOTER_LINKS%%</nav>
    </div>
  </footer>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">&uarr; top</button>
  <div id="search-overlay" class="search-overlay">
    <div class="search-panel">
      <div class="search-input-row">
        <span class="search-prompt">$</span>
        <input id="search-input" type="text" placeholder="search posts, projects&hellip;" autocomplete="off">
        <kbd>esc</kbd>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>
  <script src="%%ROOT_REL%%search-index.js"></script>
  <script src="%%ROOT_REL%%main.js"></script>
</body>
</html>
